[package]
name = "vtracker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tiny_http = "0.12"
hound = "3.5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
fs2 = "0.4"
libc = "0.2"

tempfile = "3"

# Keep model fingerprinting fast in the debug app used by the macOS launcher.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev]
opt-level = 1
