<!doctype html>
<html lang="ru" data-theme="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>VTASK — встречи и поручения</title><link rel="stylesheet" href="/styles.css"></head>
<body><a class="skip" href="#main">Перейти к содержимому</a><div class="app-shell">
<aside class="sidebar" id="sidebar"><button id="navClose" class="icon-button" aria-label="Закрыть навигацию">×</button><a class="brand" href="#overview" aria-label="VTASK — обзор"><img class="brand-logo brand-logo-light" src="/vtask-light.svg" width="156" height="48" alt=""><img class="brand-logo brand-logo-dark" src="/vtask-dark.svg" width="156" height="48" alt=""></a><nav aria-label="Основная навигация" id="navigation"></nav><div class="sidebar-bottom"><button id="modeButton" class="subtle">Посмотреть демо</button><button data-nav="settings" class="nav-item" id="settingsNav">Настройки</button><div class="local-note"><span class="local-dot"></span>Данные на этом компьютере</div></div></aside>
<div class="work-area"><header class="topbar"><button id="navToggle" class="icon-button" aria-label="Открыть навигацию" aria-expanded="false">☰</button><div class="heading"><div id="breadcrumb" class="eyebrow"></div><h1 id="pageTitle">Сегодня</h1><p id="meetingSubtitle" class="meeting-subtitle" hidden></p></div><div id="pageActions" class="actions"></div><div class="header-tools"><label class="theme-control"><span>Тема</span><select id="headerTheme" aria-label="Тема интерфейса"><option value="system">Как в системе</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label><div class="assistant-tools"><button id="assistantButton"><span class="assistant-avatar" aria-hidden="true"></span>Ассистент</button></div></div></header>
<div id="demoBanner" class="demo-banner" hidden>Демонстрационный режим · пример данных, не реальные совещания <button id="leaveDemo">Вернуться к моим данным</button></div>
<div id="recordingBar" class="recording-bar" hidden aria-label="Активная запись"></div><div id="notice" role="alert" hidden></div>
<div class="content-layout"><main id="main" tabindex="-1"><div class="loading">Загружаем рабочее пространство…</div></main><aside id="inspector" class="inspector" aria-label="Карточка задачи" hidden></aside></div></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div><dialog id="commandPalette" aria-labelledby="commandTitle"><h2 id="commandTitle">Найти задачу или раздел</h2><label>Тема, исполнитель или раздел<input id="commandQuery" type="search" autofocus></label><button id="commandVoice" class="assistant-mic" aria-label="Голосовой поиск" type="button" title="Голос распознаёт браузер. Он может использовать облачный сервис."><span aria-hidden="true"></span></button><p id="commandVoiceStatus" class="muted" role="status"></p><div id="commandResults"></div><button id="commandClose">Закрыть</button></dialog><dialog id="unsavedDialog" aria-labelledby="unsavedTitle"><h2 id="unsavedTitle">Сохранить изменения?</h2><p>В форме есть несохранённые правки.</p><p class="callout danger" role="alert" hidden></p><div class="dialog-actions"><button type="button">Продолжить редактирование</button><button type="button">Не сохранять</button><button type="button" class="primary">Сохранить</button></div></dialog><dialog id="modal" aria-labelledby="modalTitle"></dialog><script type="module" src="/app.js"></script></body></html>
